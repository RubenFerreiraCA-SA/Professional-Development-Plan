name: promotion-verify
on:
  pull_request:
permissions:
  contents: read
  attestations: read
  packages: read
jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HARBOUR_EXPECT_REPO: ${{ github.repository }}
      HARBOUR_REQUIRE_BRANCH: main
      GH_VERSION: "2.102.0"
      GH_TARBALL_SHA256: "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: azure/setup-kubectl@v4
        with: {version: v1.31.0}
      - name: Install pinned gh (checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o gh.tgz \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "${GH_TARBALL_SHA256}  gh.tgz" | sha256sum -c -
          tar -xzf gh.tgz
          sudo install -m 0755 "gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version | grep -F "$GH_VERSION"
      - name: Verify every staging overlay (G1-02 — all overlays, every PR)
        run: |
          set -euo pipefail
          # Deterministic discovery — do NOT early-exit on empty deploy/ diff.
          # Shared components under platform/components/ can change effective images.
          [ -d deploy ] || { echo "FAIL: missing deploy/ directory"; exit 1; }
          mapfile -t OVERLAYS < <(find deploy -path '*/overlays/staging' -type d | sort -u)
          [ "${#OVERLAYS[@]}" -ge 1 ] || { echo "FAIL: no staging overlays discovered"; exit 1; }

          ALLOW="platform/policy/approved-signer-workflows.txt"
          [ -f "$ALLOW" ] || { echo "FAIL: missing $ALLOW"; exit 1; }
          VERIFIED=0
          SKIPPED=0

          for OVERLAY in "${OVERLAYS[@]}"; do
            svc="$(echo "$OVERLAY" | sed -E 's#^deploy/([^/]+)/.*#\1#')"
            set +e
            kubectl kustomize "$OVERLAY" >/tmp/harbour-rendered.yaml 2>/tmp/kust.err
            KUST_RC=$?
            set -e
            [ "$KUST_RC" -eq 0 ] || {
              echo "FAIL: kustomize $OVERLAY"; cat /tmp/kust.err; exit 1; }

            set +e
            IMAGE_DATA="$(python3 platform/bin/harbour-promote-verify-images.py /tmp/harbour-rendered.yaml 2>/tmp/img.err)"
            IMG_RC=$?
            set -e
            [ "$IMG_RC" -eq 0 ] || {
              echo "FAIL: rendered-image extraction for $svc"; cat /tmp/img.err; exit 1; }
            [ -n "$IMAGE_DATA" ] || { echo "FAIL: empty rendered-image result for $svc"; exit 1; }

            ACTION="$(printf '%s' "$IMAGE_DATA" | jq -r .action)"
            [ "$?" -eq 0 ] || { echo "FAIL: jq parse of IMAGE_DATA.action"; exit 1; }
            if [ "$ACTION" = "skip" ]; then
              echo "skip $svc ($(printf '%s' "$IMAGE_DATA" | jq -r .reason))"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            set +e
            mapfile -t REFS < <(printf '%s' "$IMAGE_DATA" | jq -r '.verified_refs[]')
            ENUM_RC=$?
            set -e
            [ "$ENUM_RC" -eq 0 ] || { echo "FAIL: jq enumeration of verified_refs for $svc"; exit 1; }
            [ "${#REFS[@]}" -ge 1 ] || { echo "FAIL: zero verified refs for $svc"; exit 1; }

            for ref in "${REFS[@]}"; do
              [ -n "$ref" ] || continue
              dig="${ref##*@}"
              MAN="docs/releases/${svc}/${dig}.json"
              [ -f "$MAN" ] || { echo "FAIL: missing release manifest $MAN"; exit 1; }
              commit="$(jq -r .commit "$MAN")"
              [ "$(jq -r .image "$MAN")" = "$ref" ] \
                || { echo "FAIL: manifest image does not match rendered $ref"; exit 1; }
              platform/bin/harbour-verify-artifact "$ref" \
                --approved-workflows-file "$ALLOW" \
                --expect-commit "$commit" \
                --require-branch "$HARBOUR_REQUIRE_BRANCH"
              VERIFIED=$((VERIFIED + 1))
            done
          done
          echo "OK: promotion-verify complete (overlays=${#OVERLAYS[@]} attestations_run=$VERIFIED skipped=$SKIPPED)"
